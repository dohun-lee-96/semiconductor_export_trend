<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="반도체 동향">
  <title>반도체 수출입 동향</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./src/icon.svg">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
  <link rel="stylesheet" href="./src/styles.css?v=15">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Korea Semiconductor Trade Monitor</p>
        <h1>반도체 수출입 동향</h1>
      </div>
    </header>

    <p class="update-status" id="updateMessage" hidden></p>

    <section class="kpi-grid" aria-label="핵심 지표">
      <article class="kpi-card">
        <span class="kpi-label">최신 월 수출액</span>
        <strong id="latestMonthly">-</strong>
        <small id="latestMonthLabel">-</small>
      </article>
    </section>

    <section class="manual-card">
      <div class="table-heading">
        <div>
          <h2>월별 데이터 직접 추가</h2>
          <p>월과 반도체 수출액을 입력한 뒤 추가를 누르면 그래프와 표가 바로 업데이트됩니다.</p>
        </div>
      </div>
      <form id="manualDataForm" class="manual-form">
        <label>
          <span>월</span>
          <input id="manualPeriod" type="month" min="2016-01" required>
        </label>
        <label>
          <span>반도체 수출액</span>
          <input id="manualExport" type="number" inputmode="decimal" min="0" step="0.01" placeholder="예: 99.46" required>
        </label>
        <button type="submit" class="manual-add-button">추가</button>
      </form>
    </section>

    <section class="chart-card">
      <div class="chart-heading">
        <div>
          <h2>월별 반도체 수출 그래프</h2>
          <p>단위: 억 달러.</p>
        </div>
        <label class="month-picker chart-month-picker">
          <span>기간 선택</span>
          <select id="monthSelect" aria-label="표시할 기간" autocomplete="off">
            <option value="6">6개월</option>
            <option value="12" selected>1년</option>
            <option value="120">10년</option>
          </select>
        </label>
      </div>
      <div class="chart-wrap">
        <canvas id="dailyExportChart"></canvas>
      </div>
    </section>

    <section class="table-card">
      <div class="table-heading">
        <h2>월별 데이터</h2>
        <p>앱 실행 시 저장된 영구 데이터를 참조합니다.</p>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>월</th>
              <th>반도체 수출</th>
              <th>전월 대비</th>
            </tr>
          </thead>
          <tbody id="dataTable"></tbody>
        </table>
      </div>
    </section>

    <footer class="footer">
      <span>출처: 산업통상자원부 MOTIR 월별 수출입 동향 PDF 기반</span>
      <span id="lastUpdated"></span>
    </footer>
  </main>

  <script src="./src/data.js?v=15"></script>
  <script src="./src/app.js?v=15"></script>
</body>
</html>
